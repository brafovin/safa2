<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stadiumSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1E3B"/>
      <stop offset="0.5" stop-color="#1B3C6F"/>
      <stop offset="1" stop-color="#2a5a99"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d7a2d"/>
      <stop offset="1" stop-color="#1a4a1a"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#stadiumSky)"/>
  <!-- Stadium lights -->
  <g fill="#FFFACD" opacity="0.5">
    <circle cx="40" cy="30" r="4"/>
    <circle cx="80" cy="20" r="3"/>
    <circle cx="130" cy="25" r="3"/>
    <circle cx="180" cy="22" r="3"/>
    <circle cx="230" cy="28" r="4"/>
    <circle cx="270" cy="35" r="3"/>
  </g>
  <!-- Crowd silhouette -->
  <path d="M0,130 Q50,115 100,125 Q150,110 200,125 Q250,115 300,130 L300,170 L0,170 Z" fill="#050a14" opacity="0.6"/>
  <!-- Pitch -->
  <rect x="0" y="260" width="300" height="140" fill="url(#pitch)"/>
  <path d="M0,260 L300,260" stroke="#fff" stroke-width="2" opacity="0.6"/>
  <!-- Goal -->
  <g transform="translate(200,200)" stroke="#fff" stroke-width="2" fill="none" opacity="0.8">
    <rect x="0" y="0" width="80" height="55"/>
    <path d="M0,0 L5,55 M20,0 L25,55 M40,0 L45,55 M60,0 L65,55 M80,0 L85,55" opacity="0.4"/>
  </g>
  <!-- Wall of defenders -->
  <g transform="translate(40,210)" fill="#111" opacity="0.9">
    <ellipse cx="0" cy="55" rx="12" ry="6"/>
    <rect x="-9" y="10" width="18" height="45" rx="3"/>
    <circle cx="0" cy="3" r="8"/>
  </g>
  <g transform="translate(65,210)" fill="#111" opacity="0.9">
    <ellipse cx="0" cy="55" rx="12" ry="6"/>
    <rect x="-9" y="10" width="18" height="45" rx="3"/>
    <circle cx="0" cy="3" r="8"/>
  </g>
  <g transform="translate(90,210)" fill="#111" opacity="0.9">
    <ellipse cx="0" cy="55" rx="12" ry="6"/>
    <rect x="-9" y="10" width="18" height="45" rx="3"/>
    <circle cx="0" cy="3" r="8"/>
  </g>
  <!-- Messi silhouette (kicker) -->
  <g transform="translate(150,260)" fill="#74ACDF" stroke="#fff" stroke-width="1.5">
    <circle cx="0" cy="-60" r="10"/>
    <path d="M-2,-50 L-10,-20 L-20,10 L-15,40 L-5,40 L0,10 L8,-5 L12,-20 L6,-50 Z"/>
    <path d="M8,-30 L28,-15 L22,-5 L2,-20 Z"/>
    <path d="M-15,40 L-25,55 L-15,58 L-10,45 Z" fill="#111"/>
  </g>
  <!-- Ball in flight -->
  <g transform="translate(195,175)">
    <circle cx="0" cy="0" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <polygon points="0,-6 5,-2 3,4 -3,4 -5,-2" fill="#000" opacity="0.8"/>
  </g>
  <!-- Motion lines -->
  <g stroke="#fff" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M155,255 Q175,220 190,185"/>
    <path d="M165,260 Q180,225 188,195" opacity="0.4"/>
  </g>
  <text x="150" y="390" text-anchor="middle" font-family="Arial Black" font-size="24" font-weight="900" fill="#FFD700" stroke="#000" stroke-width="0.8">FREISTOSS</text>
</svg>
