    <g fill="#2E7D32">
      <path d="M0,0 Q-40,-20 -60,-50 Q-45,-40 -20,-25 Q-10,-15 0,-5 Z"/>
      <path d="M0,0 Q40,-20 60,-50 Q45,-40 20,-25 Q10,-15 0,-5 Z"/>
      <path d="M0,0 Q-30,-40 -50,-80 Q-30,-65 -15,-40 Q-5,-25 0,-10 Z"/>
      <path d="M0,0 Q30,-40 50,-80 Q30,-65 15,-40 Q5,-25 0,-10 Z"/>
