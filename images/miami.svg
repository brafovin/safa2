    <path d="M-70,-70 L-85,-20 L-70,0 L-70,95 L70,95 L70,0 L85,-20 L70,-70 L30,-88 Q0,-60 -30,-88 Z" fill="#F7B5CD" stroke="#000000" stroke-width="2"/>
