<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgRad" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#3A1414"/>
      <stop offset="1" stop-color="#0A0000"/>
    </radialGradient>
    <radialGradient id="goldBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset="0.4" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#8B6508"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bgRad)"/>
  <!-- Rays -->
  <g transform="translate(150,180)" opacity="0.3">
    <g fill="#FFD700">
      <polygon points="0,-200 10,-90 -10,-90"/>
      <polygon points="0,200 10,90 -10,90"/>
      <polygon points="-200,0 -90,10 -90,-10"/>
      <polygon points="200,0 90,10 90,-10"/>
      <polygon points="-140,-140 -70,-60 -60,-70"/>
      <polygon points="140,-140 70,-60 60,-70"/>
      <polygon points="-140,140 -70,60 -60,70"/>
      <polygon points="140,140 70,60 60,70"/>
    </g>
  </g>
  <!-- Golden ball -->
  <g transform="translate(150,180)">
    <circle cx="0" cy="0" r="85" fill="url(#goldBall)" stroke="#8B6508" stroke-width="3"/>
    <!-- Pentagon pattern -->
    <g fill="none" stroke="#8B6508" stroke-width="2" opacity="0.7">
      <polygon points="0,-50 48,-15 30,40 -30,40 -48,-15"/>
      <line x1="0" y1="-50" x2="0" y2="-85"/>
      <line x1="48" y1="-15" x2="80" y2="-28"/>
      <line x1="30" y1="40" x2="52" y2="68"/>
      <line x1="-30" y1="40" x2="-52" y2="68"/>
      <line x1="-48" y1="-15" x2="-80" y2="-28"/>
    </g>
    <ellipse cx="-25" cy="-30" rx="20" ry="12" fill="#FFF" opacity="0.35"/>
  </g>
  <!-- Base -->
  <rect x="60" y="290" width="180" height="20" rx="3" fill="#2a1a0a"/>
  <rect x="90" y="280" width="120" height="12" fill="#4a2d14"/>
  <text x="150" y="345" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#FFD700">BALLON D'OR</text>
  <text x="150" y="378" text-anchor="middle" font-family="Arial Black" font-size="36" font-weight="900" fill="#FFE066">×8</text>
</svg>
