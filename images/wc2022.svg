    <path d="M-32,20 L-26,60 L26,60 L32,20 Z" fill="url(#gold)" stroke="#8B6508" stroke-width="2"/>
    <rect x="-44" y="58" width="88" height="16" fill="url(#gold)" stroke="#8B6508" stroke-width="2"/>
    <rect x="-56" y="74" width="112" height="20" rx="3" fill="#4A2C14"/>
    <path d="M-50,-50 Q-90,-30 -60,10" fill="none" stroke="url(#gold)" stroke-width="10"/>
    <path d="M50,-50 Q90,-30 60,10" fill="none" stroke="url(#gold)" stroke-width="10"/>
  </g>
  <text x="150" y="335" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" font-weight="900" fill="#0B1E3B">WM 2022</text>
  <text x="150" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0B1E3B">CAMPEONES</text>
