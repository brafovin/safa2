<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="goatBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2A8"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="300" height="400" fill="url(#goatBg)"/>
  <!-- Crown -->
  <g transform="translate(150,75)" fill="url(#goldText)" stroke="#8B6508" stroke-width="1.5">
    <path d="M-55,15 L-55,-15 L-30,5 L0,-25 L30,5 L55,-15 L55,15 Z"/>
    <circle cx="-55" cy="-15" r="5" fill="#C2185B"/>
    <circle cx="0" cy="-25" r="5" fill="#1976D2"/>
    <circle cx="55" cy="-15" r="5" fill="#388E3C"/>
    <rect x="-55" y="15" width="110" height="8"/>
  </g>
  <!-- GOAT text -->
  <text x="150" y="175" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="60" font-weight="900" fill="url(#goldText)" stroke="#8B6508" stroke-width="2" letter-spacing="4">GOAT</text>
  <!-- Big 10 -->
  <text x="150" y="295" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="130" font-weight="900" fill="url(#goldText)" stroke="#8B6508" stroke-width="3">10</text>
  <!-- Stars -->
  <g fill="url(#goldText)">
    <polygon points="40,210 44,220 54,220 46,227 49,238 40,231 31,238 34,227 26,220 36,220"/>
    <polygon points="260,210 264,220 274,220 266,227 269,238 260,231 251,238 254,227 246,220 256,220"/>
  </g>
  <text x="150" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700" fill="#FFD700">Greatest Of All Time</text>
  <text x="150" y="385" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#fff" letter-spacing="6">MESSI</text>
</svg>
