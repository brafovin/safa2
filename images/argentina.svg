<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="argStripes" x="0" y="0" width="60" height="400" patternUnits="userSpaceOnUse">
      <rect width="30" height="400" fill="#74ACDF"/>
      <rect x="30" width="30" height="400" fill="#FFFFFF"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#argStripes)"/>
  <!-- Three stars (3 World Cups) -->
  <g fill="#FFD700" stroke="#8B6508" stroke-width="1">
    <polygon points="110,50 115,62 128,62 118,70 122,83 110,75 98,83 102,70 92,62 105,62" />
    <polygon points="150,40 155,52 168,52 158,60 162,73 150,65 138,73 142,60 132,52 145,52" />
    <polygon points="190,50 195,62 208,62 198,70 202,83 190,75 178,83 182,70 172,62 185,62" />
  </g>
  <!-- Player silhouette with 10 -->
  <g transform="translate(150,210)">
    <circle cx="0" cy="-80" r="28" fill="#E8C39E" stroke="#333" stroke-width="1.5"/>
    <path d="M-8,-100 Q0,-115 10,-100" fill="#3B2415"/>
    <path d="M-70,-55 L-85,-10 L-70,10 L-70,110 L70,110 L70,10 L85,-10 L70,-55 L30,-75 Q0,-55 -30,-75 Z" fill="url(#argStripes)" stroke="#0B1E3B" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" font-family="Arial Black" font-size="90" font-weight="900" fill="#0B1E3B">10</text>
  </g>
  <rect x="0" y="355" width="300" height="45" fill="#0B1E3B"/>
  <text x="150" y="385" text-anchor="middle" font-family="Arial Black" font-size="26" font-weight="900" fill="#FFD700">ARGENTINA</text>
</svg>
