    <path d="M-80,-80 L-100,-30 L-80,0 L-80,110 L80,110 L80,0 L100,-30 L80,-80 L40,-100 Q0,-70 -40,-100 Z" fill="#A50044" stroke="#FFCB05" stroke-width="3"/>
    <rect x="-70" y="-70" width="140" height="180" fill="url(#blaugrana)" clip-path="inset(0 round 10)"/>
    <path d="M-70,-70 L-70,110 L70,110 L70,-70 L40,-90 Q0,-60 -40,-90 Z" fill="none" stroke="#FFCB05" stroke-width="2"/>
