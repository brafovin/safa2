    <text x="0" y="-30" text-anchor="middle" font-family="Arial Black" font-size="18" font-weight="900" fill="#FFCB05">MESSI</text>
  </g>
  <text x="150" y="375" text-anchor="middle" font-family="Arial Black" font-size="24" font-weight="900" fill="#FFCB05" stroke="#000" stroke-width="0.8">FC BARCELONA</text>
