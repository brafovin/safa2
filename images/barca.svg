      <rect width="30" height="400" fill="#A50044"/>
      <rect x="30" width="30" height="400" fill="#004D98"/>
    </pattern>
  </defs>
  <rect width="300" height="400" fill="url(#blaugrana)"/>
  <!-- Jersey shape -->
  <g transform="translate(150,200)">
